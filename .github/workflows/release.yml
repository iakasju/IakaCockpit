name: release

# Construit les binaires et les attache a la release du tag.
# Sur un tag pousse : les 4 plateformes. En declenchement manuel : au choix,
# pour ne pas consommer inutilement les minutes macOS (facturees 10x).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de version a construire (ex. v0.1.0)'
        required: true
      platforms:
        description: 'Plateformes a construire'
        type: choice
        required: true
        default: toutes
        options:
          - toutes
          - windows,linux
          - windows
          - linux
          - macos

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          SEL="${{ github.event.inputs.platforms || 'toutes' }}"
          ALL='[
            {"key":"macos-arm64","platform":"macos-latest","args":"--target aarch64-apple-darwin","rust":"aarch64-apple-darwin"},
            {"key":"macos-x64","platform":"macos-latest","args":"--target x86_64-apple-darwin","rust":"x86_64-apple-darwin"},
            {"key":"linux","platform":"ubuntu-22.04","args":"","rust":""},
            {"key":"windows","platform":"windows-latest","args":"","rust":""}
          ]'
          if [ "$SEL" = "toutes" ]; then
            M=$(echo "$ALL" | jq -c .)
          else
            M=$(echo "$ALL" | jq -c --arg sel "$SEL" \
              '($sel|split(",")) as $s | [ .[] | select( .key as $k | $s | any(. as $x | $k|startswith($x)) ) ]')
          fi
          echo "plateformes retenues : $(echo "$M" | jq -r '[.[].key]|join(", ")')"
          echo "matrix=$M" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Dependances systeme Linux
        if: matrix.key == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev libasound2-dev cmake pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Installer les dependances
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # L34 : signature minisign des artefacts updater. Sans ces deux secrets,
          # le bundler ne produit AUCUN `.sig` et la mise a jour automatique ne peut
          # pas fonctionner (le client refuse une charge utile non signee). Leur
          # renseignement cote GitHub est un gate humain.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseDraft: false
          prerelease: false
          # DEFAUT G — le CI posait sur la release un SECOND manifeste `latest.json`, concurrent
          # du notre. Deux manifestes cote a cote, et celui du CI ne connait pas nos cles
          # d'installeur : il n'annonce que {os}-{arch}, et prefere le MSI au NSIS
          # (`updaterJsonPreferNsis` vaut `false` par defaut) — l'inverse exact de notre
          # arbitrage. Le manifeste qui fait autorite est `updater/latest.json`, versionne et
          # servi par les endpoints ; celui-ci n'etait qu'un doublon trompeur.
          #
          # `uploadUpdaterSignatures` reste a son defaut `true` : les `.sig` continuent d'etre
          # televerses, et ils sont INDISPENSABLES — `publish-update.mjs` les lit sur la release
          # pour remplir le champ `signature` du manifeste ; sans eux le manifeste serait vide.
          # L'entree est DISTINCTE, verifie sur la source de l'action : « Does not affect the
          # latest.json generator ».
          #
          # Aucune entree de RENOMMAGE n'existe (verifie sur action.yml : seules
          # `uploadUpdaterJson`, `updaterJsonPreferNsis`, `uploadUpdaterSignatures`) — « lui
          # faire ecrire un nom distinct » n'etait pas une option disponible.
          uploadUpdaterJson: false
          args: ${{ matrix.args }}
