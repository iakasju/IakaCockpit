name: release

# Construit les binaires et les attache a la release du tag.
# Sur un tag pousse : les 4 plateformes. En declenchement manuel : au choix,
# pour ne pas consommer inutilement les minutes macOS (facturees 10x).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de version a construire (ex. v0.1.0)'
        required: true
      platforms:
        description: 'Plateformes a construire'
        type: choice
        required: true
        default: toutes
        options:
          - toutes
          - windows,linux
          - windows
          - linux
          - macos
      casser:
        # AR-5(a) / CA-A5/CA-B5, RELEASE-BROUILLON-JUSQUA-MATRICE-VERTE-COCKPIT/-GUI (2026-09-08) — LEVIER
        # DE SABOTAGE VOLONTAIRE, RESERVE AU DECIDEUR. Convention transposee TELLE QUELLE depuis
        # iakaInstall (RELEASE-PARTIELLE-PUBLIEE, 2026-09-05) : seul un run REEL avec un build
        # volontairement casse prouve que la release reste en brouillon — aucune garde statique
        # ne peut le prouver (elle lit du texte, pas du comportement). Cette entree n'est
        # honoree que sur `workflow_dispatch` (jamais sur un `push` de tag, ou
        # `github.event.inputs.casser` est structurellement vide) — garde par lecture du texte
        # dans `scripts/lib/release-publication.mjs`. Le RUN qui l'active est un acte du
        # decideur, jamais de l'agent.
        description: 'RESERVE AU DECIDEUR — sabote volontairement une plateforme pour prouver que la release reste en brouillon. Inerte hors workflow_dispatch.'
        type: choice
        required: false
        default: aucune
        options:
          - aucune
          - windows
          - linux
          - macos-x64
          - macos-arm64

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      release_id: ${{ steps.brouillon.outputs.release_id }}
    steps:
      - id: set
        run: |
          SEL="${{ github.event.inputs.platforms || 'toutes' }}"
          ALL='[
            {"key":"macos-arm64","platform":"macos-latest","args":"--target aarch64-apple-darwin","rust":"aarch64-apple-darwin"},
            {"key":"macos-x64","platform":"macos-latest","args":"--target x86_64-apple-darwin","rust":"x86_64-apple-darwin"},
            {"key":"linux","platform":"ubuntu-22.04","args":"","rust":""},
            {"key":"windows","platform":"windows-latest","args":"","rust":""}
          ]'
          if [ "$SEL" = "toutes" ]; then
            M=$(echo "$ALL" | jq -c .)
          else
            M=$(echo "$ALL" | jq -c --arg sel "$SEL" \
              '($sel|split(",")) as $s | [ .[] | select( .key as $k | $s | any(. as $x | $k|startswith($x)) ) ]')
          fi
          echo "plateformes retenues : $(echo "$M" | jq -r '[.[].key]|join(", ")')"
          echo "matrix=$M" >> "$GITHUB_OUTPUT"

      # AR-1(a) + AR-2(b), RELEASE-BROUILLON-JUSQUA-MATRICE-VERTE-COCKPIT/-GUI (2026-09-08) —
      # CREATION SERIALISEE DU BROUILLON, UNE SEULE FOIS. Convention transposee depuis
      # iakaInstall (RELEASE-PARTIELLE-PUBLIEE, 2026-09-05), lue au SHA epingle de tauri-action
      # (84b9d35b5fc46c1e45415bdb6144030364f7ebc5, action-v0.6.2) : `src/index.ts:178`
      # (`if (tagName && !releaseId)`) saute ENTIEREMENT la recherche/creation de release des que
      # `releaseId` est fourni au job `build` ci-dessous ; `src/create-release.ts:103-113`
      # (creation) ne passe jamais `make_latest`. Creer le brouillon ICI, une seule fois, dans un
      # job qui ne tourne jamais en parallele avec lui-meme, FERME PAR CONSTRUCTION la course F8
      # (tauri-apps/tauri-action#914 : creation de releases en double sur une matrice
      # concurrente) — les jobs de `build` n'ont plus jamais a chercher ni creer de release, ils
      # ne font qu'y deposer des artefacts via `releaseId`.
      - id: brouillon
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          DEPOT: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ID=$(gh api "repos/$DEPOT/releases" -X POST \
            -f tag_name="$TAG" \
            -f name="$TAG" \
            -f target_commitish="$SHA" \
            -F draft=true \
            -F prerelease=false \
            --jq .id)
          echo "brouillon cree : tag=$TAG id=$ID (repos/$DEPOT/releases, draft=true, prerelease=false)"
          echo "release_id=$ID" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Dependances systeme Linux
        if: matrix.key == 'linux'
        run: |
          sudo apt-get update
          xargs -r -a .github/deps-linux.txt sudo apt-get install -y

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Installer les dependances
        run: npm ci

      # AR-5(a) / CA-A5/CA-B5 — SABOTAGE VOLONTAIRE, RESERVE AU DECIDEUR, AVANT `tauri-action`.
      # Convention transposee depuis iakaInstall (RELEASE-PARTIELLE-PUBLIEE, 2026-09-05).
      # Honore UNIQUEMENT sur `workflow_dispatch` (jamais sur un `push` de tag : sur ce
      # declencheur `github.event.inputs.casser` est structurellement vide, la comparaison a
      # `matrix.key` echoue toujours). Place AVANT l'etape ci-dessous : rien n'est televerse
      # pour la plateforme sacrifiee, le brouillon reste incomplet EXACTEMENT comme un vrai
      # build rouge. Le RUN qui active ce levier appartient au decideur, jamais a l'agent ;
      # garde statique de cette inertie : scripts/lib/release-publication.mjs.
      - name: Sabotage volontaire (run de preuve reserve au decideur)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.casser == matrix.key
        run: |
          echo "::error::sabotage DELIBERE de la plateforme ${{ matrix.key }} (entree 'casser'"
          echo "::error::du workflow_dispatch) — CE N'EST PAS un vrai echec, c'est le run de"
          echo "::error::preuve : la release doit rester en brouillon apres ceci."
          exit 1

      # D-4 (L41) — REFERENT IMMUABLE. `@v0` etait un tag DEPLACABLE : le commentaire ci-dessous
      # et l'entree posee decrivaient `dev`, pas ce qui s'executait. Le SHA est celui que `v0`
      # designait au 2026-08-29 ; `fixtures/tauri-action-pin.json` en est la source et le cliquet.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signature minisign des artefacts de mise a jour (IakaCockpit : L34 ; iakaFrameGUI :
          # auto-update.md, etape 6a). Sans ces deux secrets, le bundler ne produit AUCUN fichier
          # `.sig` et l'auto-update ne sert a rien : le client refuse une charge utile non signee.
          # Leur pose dans les reglages du depot est un GATE HUMAIN — elle ne peut pas etre faite
          # depuis le depot.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # AR-1(a)+AR-2(b), RELEASE-BROUILLON-JUSQUA-MATRICE-VERTE-COCKPIT/-GUI (2026-09-08) —
          # `releaseId` (sortie de `prepare`, ci-dessus) REMPLACE `tagName`/`releaseName` : au
          # SHA epingle, `src/index.ts:178` saute la recherche/creation de release des que
          # `releaseId` est fourni, `src/index.ts:211` attache directement les artefacts a CET
          # id. Plus aucun des jobs de la matrice ne cherche ni ne cree de release : la course F8
          # est fermee par construction, pas seulement geree au job `publier` (filet de secours
          # nomme, cf. le job `publier` plus bas).
          releaseId: ${{ needs.prepare.outputs.release_id }}
          # La release existe donc PENDANT les builds, EN BROUILLON : elle recoit les artefacts,
          # aucun visiteur ne la voit. Elle ne devient publique QUE si TOUS les jobs de cette
          # matrice reussissent — voir le job `publier`, `needs: [build]` STRICT, sans `if:` :
          # c'est GitHub lui-meme qui applique la regle (un seul job de matrice en echec suffit a
          # le faire *skipper*), pas une condition ecrite par nous.
          releaseDraft: true
          prerelease: false
          # DEFAUT G — le CI posait sur la release un SECOND manifeste `latest.json`, concurrent
          # du notre. Deux manifestes cote a cote, et celui du CI ne connait pas nos cles
          # d'installeur : il n'annonce que {os}-{arch}. Le manifeste qui fait autorite est
          # `updater/latest.json`, versionne et servi par les endpoints ; celui-ci n'etait qu'un
          # doublon trompeur.
          #
          # CE QUI SUIT NE DECRIT QUE LE SHA EPINGLE CI-DESSUS (action-v0.6.2), lu dans son
          # `action.yml` et dans sa source — rien d'autre. La version precedente de ce commentaire
          # enumerait les entrees de `dev` en pretendant les avoir verifiees, et posait
          # `uploadUpdaterJson`, que ce SHA NE DECLARE PAS : l'entree etait ignoree en silence, et
          # le CI reposait bel et bien son manifeste concurrent.
          #
          # A ce SHA, `includeUpdaterJson` (defaut 'true') est la SEULE entree qui gouverne le
          # manifeste : elle garde l'unique appel a `uploadVersionJSON` (src/index.ts:223).
          #
          # Les `.sig` ne sont commandes par AUCUNE entree a ce SHA, et restent televerses :
          # `uploadReleaseAssets(...artifacts...)` (src/index.ts:212) est appele sans condition et
          # HORS du garde `includeUpdaterJson`, sur des artefacts qui incluent les `.sig`
          # (src/utils.ts:29-46). C'est indispensable : `publish-update.mjs` les lit sur la release
          # pour remplir le champ `signature` du manifeste.
          includeUpdaterJson: false
          args: ${{ matrix.args }}

  # AR-1(a), RELEASE-BROUILLON-JUSQUA-MATRICE-VERTE-COCKPIT/-GUI (2026-09-08) — LA RELEASE NE DEVIENT
  # PUBLIQUE QU'APRES LE DERNIER BUILD VERT. Convention transposee depuis iakaInstall
  # (RELEASE-PARTIELLE-PUBLIEE, 2026-09-05). `needs: [build]` STRICT, SANS `if:` : par la
  # semantique meme de GitHub Actions (docs *Use jobs in a workflow* : « if a job fails [...]
  # all jobs that need it are skipped unless [...] a conditional expression ») un SEUL job de la
  # matrice en echec suffit a faire *skipper* CE job — c'est la PLATEFORME qui applique la
  # regle, jamais une condition qu'on a ecrite soi-meme.
  # Adressage PAR `id`, JAMAIS par tag : `gh release list` n'inclut pas les brouillons
  # (cli/cli#10140), et `gh release edit <tag>` est mal defini sur un brouillon (cli/cli#11589,
  # #5252). Un brouillon UNIQUE est attendu pour ce tag (cree par `prepare`) : zero = rien a
  # publier (echec nomme), DEUX = la course F8 s'est neanmoins produite (echec nomme aussi —
  # jamais un choix a l'aveugle entre les deux).
  publier:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publier le brouillon (par id, jamais par tag)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          DEPOT: ${{ github.repository }}
        run: |
          set -euo pipefail
          # CORRECTIF post-run-reel 34026373514 (2026-09-06, cote iakaInstall) — `gh api` n'a PAS
          # d'option `--arg` (c'est une option de `jq`) : l'ancienne forme
          # `--jq --arg tag "$TAG" '...'` faisait avaler "--arg" comme VALEUR de `--jq`, et le
          # reste ("tag", la valeur de $TAG, le filtre) devenait des arguments POSITIONNELS de
          # `gh api` (qui n'en accepte qu'un, l'endpoint) -> "accepts 1 arg(s), received 4",
          # release restee en brouillon. Fix, transpose des le premier commit ici : `gh api
          # --paginate` rend le JSON BRUT (aucun `--jq` sur cette commande), et SEUL `jq`, en
          # aval, recoit `--arg` -- exactement l'option a laquelle elle appartient.
          BROUILLONS=$(gh api "repos/$DEPOT/releases" --paginate \
            | jq --arg tag "$TAG" '[.[] | select(.draft == true and .tag_name == $tag)]')
          N=$(echo "$BROUILLONS" | jq 'length')

          if [ "$N" -eq 0 ]; then
            echo "::error::aucun brouillon trouve pour le tag $TAG sur $DEPOT — rien a publier."
            echo "::error::le job 'prepare' a-t-il bien cree le brouillon (etape 'brouillon') ?"
            exit 1
          fi

          if [ "$N" -gt 1 ]; then
            IDS=$(echo "$BROUILLONS" | jq -r '[.[].id] | join(", ")')
            echo "::error::$N brouillons trouves pour le tag $TAG (ids: $IDS)."
            echo "::error::la course F8 (tauri-apps/tauri-action#914) s'est probablement"
            echo "::error::produite malgre la creation serialisee dans 'prepare'. AUCUN des deux"
            echo "::error::n'est publie a l'aveugle : nettoyage MANUEL requis (acte de release,"
            echo "::error::reserve au decideur)."
            exit 1
          fi

          ID=$(echo "$BROUILLONS" | jq -r '.[0].id')
          AVANT=$(gh api "repos/$DEPOT/releases/$ID" --jq '{draft,tag_name,n:(.assets|length)}')
          echo "avant publication : $AVANT"

          gh api -X PATCH "repos/$DEPOT/releases/$ID" -F draft=false > /dev/null

          APRES=$(gh api "repos/$DEPOT/releases/$ID" --jq '{draft,tag_name,n:(.assets|length)}')
          echo "tag publie       : $TAG"
          echo "id de la release : $ID"
          echo "apres publication: $APRES"

  # ┌─ L42 -> L44 — LE `latest` CESSE D'ETRE SUBI ──────────────────────────────────────────────────┐
  # │ L44 — CE QUE CE JOB FAIT, MESURE, AU 2026-09-01. Le cartouche a dit qu'il EMPECHAIT le vol du │
  # │ `latest`, puis qu'il le REPARAIT ; il ne faisait ni l'un ni l'autre. Ce qui suit est ce qu'il │
  # │ fait apres le lot L44, et rien de plus. On date, on n'efface pas.                             │
  # │                                                                                               │
  # │ CE QU'IL NE FAIT TOUJOURS PAS : EMPECHER. La release est creee AVANT que ce job demarre (F2,  │
  # │ L43) — au SHA epingle, `tauri-action` appelle `createRelease` SANS `make_latest`, donc au     │
  # │ defaut `true`. La fenetre du vol n'est pas fermee, elle est RACCOURCIE : de « jusqu'au geste  │
  # │ manuel du decideur » a « la duree de ce job ». C'est tout ce qu'il y avait a gagner.          │
  # │                                                                                               │
  # │ CE QU'IL FAIT MAINTENANT : IL REPARE — et c'est mesure. La branche du vol ECRIVAIT            │
  # │ `--latest=false` sur le tag publie ; cette ecriture est INERTE (voir le tableau). Elle ecrit  │
  # │ desormais `--latest` sur le plus haut semver PORTEUR D'UNE RELEASE, ce qui rend le pointeur   │
  # │ et `PLUS_HAUT` egaux PAR CONSTRUCTION (AR-7 = (a), tranche le 2026-09-01).                    │
  # │                                                                                               │
  # │ LE TABLEAU DES CINQ ECRITURES — banc PRIVE iakasju/latest-contrefactuel, release `id`         │
  # │ 379113280 pour M2 et M3b. Aucun geste sur ce depot-ci.                                        │
  # │   `--latest` (true) via `gh release edit` . . . AGIT           M1,  2026-09-01                │
  # │   `--latest=false` via `gh release edit` . . .  inerte         mesure du 2026-08-29 (L43)     │
  # │   `make_latest=false` via `PATCH` brut . . . .  inerte         M2,  2026-09-01                │
  # │   `make_latest=legacy` via `PATCH` brut . . . . AGIT           M3b, 2026-09-01                │
  # │   `--latest=legacy` via `gh release edit` . . . INATTEIGNABLE  M3a, 2026-09-01                │
  # │ Cette derniere ligne n'est pas une note de bas de page : `--latest` est un drapeau BOOLEEN    │
  # │ (`strconv.ParseBool`), donc le regime `legacy` est HORS D'ATTEINTE du client `gh`. Quiconque  │
  # │ lira « il existe trois valeurs » et essaiera de les poser par `gh` heurtera le meme mur.      │
  # │                                                                                               │
  # │ OU SIEGE LE NO-OP. Ni dans le client, ni dans le transport, ni dans la lecture : M2 et M3b    │
  # │ portent sur la MEME release, le MEME endpoint, le MEME champ, et seule la VALEUR les separe   │
  # │ — or M3b, lui, a bouge le pointeur. Il siege dans la SEMANTIQUE DE LA VALEUR `false` cote     │
  # │ API : `true` promeut, `legacy` recalcule, `false` ne demande rien et rien n'advient.          │
  # │                                                                                               │
  # │ LE RESIDU, AU 2026-09-01. La regle de repli EXISTE : elle vit sous `make_latest=legacy`,      │
  # │ elle n'est atteignable que par `PATCH`, et elle n'est PAS dirigee par la date la plus         │
  # │ recente — ni sur `created_at`, ni sur `published_at`, ni sur l'ordre d'enregistrement : le    │
  # │ plus haut semver l'a emporte sur les trois. SA FORMULE RESTE INCONNUE : les deux releases     │
  # │ mesurees sont DU MEME JOUR, donc une regle au grain du JOUR departagee par le semver          │
  # │ produirait exactement la meme sortie. `legacy` est une CONNAISSANCE, pas un remede — il       │
  # │ n'entre dans AUCUNE ligne de ce job.                                                          │
  # │                                                                                               │
  # │ LA DOC DE GITHUB EST REFUTEE PAR MESURE. `GET /releases/latest` y est decrit comme rendant    │
  # │ « the most recent non-prerelease, non-draft release, sorted by the `created_at` attribute ».  │
  # │ Le banc la refute DEUX FOIS : avant M1 et apres M3b, le pointeur etait sur le `created_at`    │
  # │ le PLUS ANCIEN des deux. A savoir aussi : `created_at` est la date du COMMIT du tag, pas      │
  # │ celle de la release. Une doc ne se refute pas en la relisant, elle se refute en mesurant.     │
  # │                                                                                               │
  # │ CE QUI N'EST PAS TRANSPOSE. Tout ce qui precede est mesure sur un BANC PRIVE du meme compte,  │
  # │ avec `gh release create` comme acteur substitut — pas `tauri-action`, pas ce depot. La        │
  # │ transposition reste l'objet de CA-5, et CA-5 RESTE DU.                                        │
  # │                                                                                               │
  # │ POURQUOI UNE ETAPE SEPAREE, PAS UNE ENTREE DE `tauri-action` : le SHA epingle par L41         │
  # │ (84b9d35b..., action-v0.6.2) N'EXPOSE AUCUNE entree pilotant le pointeur. Le desepingler      │
  # │ pour en trouver une defairait L41 — `fixtures/tauri-action-pin.json` rougirait, A RAISON.     │
  # │                                                                                               │
  # │ Mesures, arbitrages et residu complets : specs/instructions/re-cadrage-garde-latest.md.       │
  # └───────────────────────────────────────────────────────────────────────────────────────────────┘
  #
  # MIS A JOUR le 2026-09-08 (RELEASE-BROUILLON-JUSQUA-MATRICE-VERTE-COCKPIT/-GUI, jumelle du lot
  # CONVERGENCE-TROIS-FRERES) — ETAT ANTERIEUR CI-DESSUS CONSERVE, ON DATE, ON N'EFFACE PAS.
  # `needs` passe de `build` a `publier`. Sans cet ordre, `latest` et `publier` demarreraient
  # ENSEMBLE : `latest` lirait la release ENCORE BROUILLON (filtree par `select(.draft|not)`,
  # donc invisible), designerait l'ancienne version — puis `publier` publierait APRES coup,
  # reprenant le pointeur au defaut de l'API SANS que personne ne le re-affirme. On aurait
  # fabrique un VOL du `latest` par ce workflow lui-meme. `if: always()` EST CONSERVE : ce job
  # doit tourner MEME quand `publier` est *skippe* (matrice rouge), pour ne pas laisser le
  # pointeur au hasard du defaut de l'API.
  latest:
    needs: publier
    # `always()` : les artefacts sont DEJA televerses quand ce job demarre. Ne pas designer le
    # `latest` sur une matrice partiellement rouge laisserait le drapeau au defaut `true` — donc
    # au hasard de l'ordre de publication, c'est-a-dire au defaut qu'on repare.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Designer explicitement le latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          DEPOT: ${{ github.repository }}
        run: |
          set -euo pipefail
          # (2a) LE REFERENT EST LA POPULATION DES RELEASES, PAS CELLE DES TAGS. Rectifie le
          # 2026-09-01 (lot L44, defaut R-2). La ligne d'origine lisait la population des TAGS ; or
          # `GET /releases/latest` ne peut JAMAIS rendre autre chose qu'un tag PORTEUR d'une
          # release. Les deux populations ne coincident pas : 4 tags sur 29 portent une release
          # sur IakaCockpit (F1, L43). CE QUE LE REFERENT FAUX PRODUISAIT, et c'est double :
          #   - FAUX ROUGE. Apres un build ROUGE — le cas que `if: always()` couvre EXPRES, ou
          #     `tauri-action` ne cree AUCUNE release —, un tag de version reste sans release ;
          #     `PLUS_HAUT` designait alors ce tag, et la ligne VERIFICATION rougissait A TORT.
          #   - DICTEE IMPOSSIBLE. Le rattrapage imprime, `gh release edit $PLUS_HAUT --latest`,
          #     s'adressait a une release QUI N'EXISTE PAS : la commande ne pouvait pas reussir.
          #     Un operateur qui suivait le message a la lettre bouclait.
          # Le filtre `^v[0-9]+\.[0-9]+\.[0-9]+$` reste : iakaFrameGUI porte aussi des tags
          # `archive/feat/*`, et les compter ferait dire n'importe quoi au « plus haut ».
          # `select(.draft|not)` et `select(.prerelease|not)` : `GET /releases/latest` ignore les
          # brouillons et les preversions ; le referent doit ignorer EXACTEMENT les memes, sans
          # quoi on recreerait l'ecart qu'on vient de fermer.
          # L'appel et le tri sont SEPARES a dessein : un echec de `gh api` doit rester un ECHEC
          # (`set -e` abandonne), et ne surtout pas se confondre avec « aucune release ».
          RELEASES=$(gh api "repos/$DEPOT/releases" --paginate \
            --jq '.[] | select(.draft|not) | select(.prerelease|not) | .tag_name')
          PLUS_HAUT=$(printf '%s\n' "$RELEASES" \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          echo "tag publie      : $TAG"
          echo "plus haut semver: $PLUS_HAUT"

          # R2 / CA-7 — AUCUNE RELEASE : il n'y a RIEN a designer. On sort en SUCCES EN LE DISANT.
          # Jamais en silence, et jamais sur une comparaison a la chaine vide plus loin, qui serait
          # muette. Ce chemin existe pour de vrai : premiere publication d'un depot, ou build rouge
          # avant la toute premiere release. C'est le prix du referent correct : `/tags` rendait
          # toujours quelque chose, `/releases` peut ne rien rendre — et c'est ce qu'on veut.
          if [ -z "$PLUS_HAUT" ]; then
            echo "AUCUNE release non-brouillon non-preversion portant un tag de version sur $DEPOT."
            echo "Il n'y a donc AUCUN latest a designer, et rien a verifier. Sortie en SUCCES."
            exit 0
          fi

          # (2b-i) LA BRANCHE DU VOL EXECUTE LE RATTRAPAGE AU LIEU DE L'IMPRIMER. Pose le
          # 2026-09-01 (lot L44), sur la mesure M1 du decideur : `gh release edit <tag> --latest`
          # DEPLACE le pointeur (banc iakasju/latest-contrefactuel, v0.10.0 -> v0.9.0). L'ancienne
          # branche ecrivait `--latest=false` sur $TAG : MESUREE INERTE deux fois (banc 2026-08-29
          # par `gh`, et M2 du 2026-09-01 par PATCH brut). Ecrire `--latest` sur $PLUS_HAUT rend
          # `latest` et `PLUS_HAUT` egaux PAR CONSTRUCTION — donc la ligne VERIFICATION ci-dessous
          # ne peut pas rougir apres l'ecriture du job. Sur le chemin nominal ($TAG = $PLUS_HAUT),
          # rien ne change : c'est exactement la commande d'avant.
          if [ "$TAG" = "$PLUS_HAUT" ]; then
            CIBLE="$TAG"
            echo "DECISION : $TAG EST le plus haut semver porteur d'une release -> il est latest."
          else
            CIBLE="$PLUS_HAUT"
            echo "DECISION : $TAG n'est PAS le plus haut ($PLUS_HAUT) -> on RE-AFFIRME --latest sur"
            echo "           $PLUS_HAUT. Sans cette ligne, le defaut make_latest=true de l'API"
            echo "           aurait laisse le latest a $TAG."
          fi

          # R6 — si `gh` echoue (droit manquant sur le runner, quota), l'echec NOMME la commande
          # de rattrapage manuelle. Les artefacts, eux, sont deja en place : rien n'est perdu.
          if ! gh release edit "$CIBLE" --latest --repo "$DEPOT"; then
            echo "::error::impossible de designer le latest sur $CIBLE."
            echo "::error::RATTRAPAGE MANUEL : gh release edit $PLUS_HAUT --latest --repo $DEPOT"
            exit 1
          fi

          # CA-6 — le workflow DIT ce qu'il a fait du latest, y compris quand il a decide de NE PAS
          # le poser. Un « OK » muet ne se relit pas.
          EFFECTIF=$(gh api "repos/$DEPOT/releases/latest" --jq '.tag_name')
          echo "VERIFICATION : latest effectif = $EFFECTIF (attendu : $PLUS_HAUT)"
          if [ "$EFFECTIF" != "$PLUS_HAUT" ]; then
            echo "::error::le latest effectif ($EFFECTIF) n'est pas le plus haut semver ($PLUS_HAUT)."
            echo "::error::RATTRAPAGE MANUEL : gh release edit $PLUS_HAUT --latest --repo $DEPOT"
            exit 1
          fi
          echo "latest maitrise : $PLUS_HAUT"
