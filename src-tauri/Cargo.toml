[package]
name = "iakacockpit"
version = "0.31.2"
description = "IakaCockpit - cockpit chapeau-rooted de l'ecosysteme iakaProject"
authors = ["Stephane / iakateam"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# Le suffixe `_lib` evite un conflit de nom lib/bin sur Windows
# (cf. https://github.com/rust-lang/cargo/issues/8519).
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
# Lignees alignees sur l'eprouve iakaIDE (deja builde sur les 3 OS).
tauri = { version = "2.11.2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
portable-pty = "0.8"
# L10a : session-id pre-genere du chef-runner (clef PTY <-> transcript JSONL).
# uuid est deja dans l'arbre (transitif Tauri 1.x) ; on active seulement v4.
uuid = { version = "1", features = ["v4"] }
# Socle securite L0
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
dirs = "5"
# Moteur IA L3 : UN appel HTTP bloquant POST JSON vers l'endpoint OpenAI-compat
# (LiteLLM/Ollama/cloud). Client synchrone leger. `tls` (rustls) ajoute HTTPS,
# utilise par L16 pour telecharger le modele whisper depuis HuggingFace (le POST
# LAN http reste possible). Pas de tokio/reqwest (sur-dimensionne). Aligne iakaIDE.
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
# Pilotage vocal L16-P1 : capture micro (cpal) + STT LOCAL whisper.cpp (whisper-rs).
# whisper-rs compile whisper.cpp via CMake (Metal sur Apple Silicon). La voix ne
# quitte jamais la machine ; modele telecharge au 1er run (non bundle).
cpal = "0.15"
whisper-rs = "0.12"
