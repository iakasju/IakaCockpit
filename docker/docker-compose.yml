# Stack Docker de projet IakaCockpit — backends locaux (cibles L3 #2/#4 + L4).
# LiteLLM (passerelle OpenAI-compat) -> Ollama (L3) ; CouchDB iakaboxlogs local (L4).
# Isolation iakaframe : nom de stack `iakacockpit`, réseau/volume/conteneurs
# préfixés `iakacockpit-dev-*`, ports hôte distincts (11435 / 4020 / 5984) qui n'entrent
# PAS en collision avec l'Ollama localhost (11434) ni les autres projets de la famille.
name: iakacockpit

networks:
  iakacockpit-dev-net:
    name: iakacockpit-dev-net

volumes:
  iakacockpit-dev-ollama-data:
    name: iakacockpit-dev-ollama-data
  iakacockpit-dev-couchdb-data:
    name: iakacockpit-dev-couchdb-data
  iakacockpit-dev-n8n-data:
    name: iakacockpit-dev-n8n-data

services:
  ollama:
    image: ollama/ollama:latest
    container_name: iakacockpit-dev-ollama
    networks: [iakacockpit-dev-net]
    # Exposé uniquement en local (127.0.0.1), port hôte 11435 -> 11434 conteneur.
    ports:
      - "127.0.0.1:11435:11434"
    volumes:
      - iakacockpit-dev-ollama-data:/root/.ollama
    restart: unless-stopped

  litellm:
    # rollback : 1.82.6 = ghcr.io/berriai/litellm@sha256:7c311546c25e7bb6e8cafede9fcd3d0d622ac636b5c9418befaa32e85dfb0186
    image: ghcr.io/berriai/litellm:1.94.0@sha256:65d84a2282137b4dc73bbe184650a7c807177c533e4223b3bfbc87963fe3fabe
    container_name: iakacockpit-dev-litellm
    depends_on: [ollama]
    networks: [iakacockpit-dev-net]
    # Passerelle OpenAI-compat exposée en local, port hôte 4020 -> 4000 conteneur.
    ports:
      - "127.0.0.1:4020:4000"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    restart: unless-stopped

  couchdb:
    image: couchdb:3
    container_name: iakacockpit-dev-couchdb
    networks: [iakacockpit-dev-net]
    # CouchDB iakaboxlogs local (recette L4), expose en local, port hote 5984.
    # Identifiants de TEST local uniquement (jamais un vrai secret).
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=iaka-test
    ports:
      - "127.0.0.1:5984:5984"
    volumes:
      - iakacockpit-dev-couchdb-data:/opt/couchdb/data
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: iakacockpit-dev-n8n
    networks: [iakacockpit-dev-net]
    # Passerelle « canal adresse externe » (Cockpit -> n8n -> Discord/Slack/MQTT).
    # Expose en local, port hote 5678. Compte proprietaire a creer au 1er lancement (UI).
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_RUNNERS_ENABLED=true
      - N8N_DIAGNOSTICS_ENABLED=false
      - GENERIC_TIMEZONE=Europe/Paris
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - iakacockpit-dev-n8n-data:/home/node/.n8n
    restart: unless-stopped
